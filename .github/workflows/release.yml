name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production signing keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "keystore_path=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_OUTPUT
            echo "store_password=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "No production keystore secret configured; falling back to temporary release key"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=StockAlertLedger, OU=Android, O=StockAlertLedger, L=Taipei, ST=Taiwan, C=TW"
            echo "keystore_path=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_OUTPUT
            echo "store_password=android" >> $GITHUB_OUTPUT
            echo "key_alias=upload" >> $GITHUB_OUTPUT
            echo "key_password=android" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="manual-build"
          fi
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            TARGET_NAME="stockAlertLedger-${TAG_NAME}.apk"
            cp "$APK_SRC" "app/build/outputs/apk/release/$TARGET_NAME"
            echo "RELEASE_APK=app/build/outputs/apk/release/$TARGET_NAME" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
